<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>北京旅行2026｜事前準備チェック</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f7fb,#0d1117);--surface:light-dark(#fff,#161b22);--surface2:light-dark(#f8fafc,#1c2128);--text:light-dark(#172033,#f0f3f6);--muted:light-dark(#667085,#9da7b3);--line:light-dark(#e5e7eb,#30363d);--accent:light-dark(#2563eb,#58a6ff);--danger:light-dark(#b42318,#ff7b72);}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)} #app{min-height:100vh;background:var(--bg)}
header{padding:24px 18px 14px;max-width:1050px;margin:auto} h1{font-size:25px;margin:0 0 5px} .sub{color:var(--muted);font-size:13px}
.wrap{max-width:1050px;margin:auto;padding:0 18px 36px} .top{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin:10px 0 16px}
.progress{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px} .bar{height:9px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:10px} .bar>i{display:block;height:100%;background:var(--accent);width:0}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px} select,button,input{font:inherit} select,button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 11px} button{cursor:pointer} button.primary{background:var(--accent);border-color:var(--accent);color:white}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px} .chip{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;cursor:pointer} .chip.active{border-color:var(--accent);color:var(--accent)}
.list{display:grid;gap:9px} .card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start} .card.done{opacity:.62} .check{width:24px;height:24px;margin-top:2px;accent-color:var(--accent)} .task{font-weight:700;line-height:1.4} .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px} .tag{font-size:11px;padding:3px 7px;border-radius:999px;background:var(--surface2);color:var(--muted)} .tag.important{color:var(--danger)} .when{font-size:12px;color:var(--muted);white-space:nowrap} .note{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5}
.summary{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)} .summary b{color:var(--text)} .empty{text-align:center;color:var(--muted);padding:35px}
@media(max-width:700px){.top{grid-template-columns:1fr} .card{grid-template-columns:auto 1fr} .when{grid-column:2} h1{font-size:22px}}
</style>
</head>
<body><div id="app">
<header><h1>北京旅行2026｜事前準備チェック</h1><div class="sub">2026/10/23〜10/26　4人共有用チェックリスト</div></header>
<main class="wrap">
<section class="top"><div class="progress"><div class="summary"><span>全体 <b id="count">0 / 0</b></span><span>進捗 <b id="pct">0%</b></span><span>表示 <b id="shown">0</b>件</span></div><div class="bar"><i id="bar"></i></div></div>
<div class="controls"><select id="person"><option value="all">担当者：全員</option><option>代表</option><option>メンバー1</option><option>メンバー2</option><option>メンバー3</option></select><button class="primary" id="clearDone">完了を非表示</button><button id="reset">この端末のチェックをリセット</button></div></section>
<div class="filters" id="filters"><span class="chip active" data-filter="all">すべて</span><span class="chip" data-filter="open">未完了</span><span class="chip" data-filter="done">完了</span><span class="chip" data-filter="important">重要</span></div>
<div class="list" id="list"></div>
</main></div>
<script>
const tasks=[{"id": 0, "when": "今すぐ", "task": "パスポート有効期限確認", "assignee": "全員", "category": "必須", "note": "中国側の必要残存期間は資料上未確認。6か月以上は安全側の目安。"}, {"id": 1, "when": "今すぐ", "task": "Alipay ＆ WeChat Pay 実名認証", "assignee": "全員", "category": "推奨手続", "note": "アプリDL・クレカ紐付け・パスポート認証。"}, {"id": 2, "when": "今すぐ", "task": "Alipay地下鉄QR開通", "assignee": "全員", "category": "推奨手続", "note": "北京設定 → 出行 → 地下鉄/Metro。"}, {"id": 3, "when": "今すぐ", "task": "eSIM手配", "assignee": "全員", "category": "推奨手続", "note": "VPN不要/LINE・Google利用可能と明記されたローミング型を想定。"}, {"id": 4, "when": "今すぐ", "task": "ホテルへの深夜到着連絡", "assignee": "代表", "category": "推奨手続", "note": "10/24未明02:00頃着。CA422・到着予定・宿泊者名・予約番号を連絡。"}, {"id": 5, "when": "今すぐ〜10/10", "task": "12306アカウント登録・パスポート本人確認", "assignee": "代表", "category": "優先度：高", "note": "パスポート情報を入力し、本人確認まで完了。"}, {"id": 6, "when": "今すぐ〜出発前", "task": "海外旅行保険・たびレジ", "assignee": "全員", "category": "推奨手続", "note": "出発前に加入・登録。"}, {"id": 7, "when": "10/11頃", "task": "京張高鉄チケット手配", "assignee": "代表", "category": "優先度：高", "note": "北京北駅を最優先、満席なら清河駅。往復を確保。"}, {"id": 8, "when": "10/11頃", "task": "八達嶺長城入場券手配", "assignee": "代表", "category": "予約推奨", "note": "高鉄切符とは別システム。実名制予約を確認。"}, {"id": 9, "when": "10/18 21:00", "task": "故宮（紫禁城）入場予約", "assignee": "代表/全員", "category": "優先度：高", "note": "10/25午後枠を手配。WeChat「故宮博物院」等。"}, {"id": 10, "when": "10/18 21:00", "task": "天安門広場の予約要否確認", "assignee": "代表", "category": "要確認", "note": "故宮予約者の別途予約不要という2022年発表があるが、現行運用は出発前再確認。"}, {"id": 11, "when": "出発前", "task": "北京動物園の入園方法確認・手配", "assignee": "代表", "category": "要確認", "note": "外国人のWeChat予約、共通券19元等を公式案内で再確認。"}, {"id": 12, "when": "10/24前", "task": "北京国家博物館の雨天代替予約", "assignee": "代表", "category": "要確認", "note": "雨天代替として使う場合のみ。予約時段に沿った入館が必要。"}, {"id": 13, "when": "10/22 21:10頃", "task": "CA422 Webチェックイン", "assignee": "全員", "category": "推奨手続", "note": "開始時刻は航空会社規定を要確認。"}, {"id": 14, "when": "10/23 日中〜搭乗前", "task": "外国人入国カードオンライン申告", "assignee": "全員", "category": "必須（申告自体）", "note": "QRは発行後24時間有効と資料記載。スクリーンショット保存。"}, {"id": 15, "when": "10/23 出発前", "task": "最終確認", "assignee": "全員", "category": "推奨手続", "note": "パスポート、QR、12306、八達嶺、故宮、動物園予約、eSIM、決済アプリ等。"}, {"id": 16, "when": "10/25 夕方〜夜", "task": "CA183 Webチェックイン", "assignee": "全員", "category": "推奨手続", "note": "10/25は景山またはホテルで実施。"}, {"id": 17, "when": "10/25まで", "task": "12306実ダイヤ最終確認", "assignee": "代表", "category": "要確認", "note": "北京北/清河、八達嶺長城駅、復路時刻を確認。"}, {"id": 18, "when": "10/25まで", "task": "故宮開放公告チェック", "assignee": "代表", "category": "確認", "note": "太和門工事・延禧宮閉鎖等の公開範囲を公式サイトで確認。"}, {"id": 19, "when": "出発直前", "task": "クレジットカード渡航連絡", "assignee": "全員", "category": "確認", "note": "中国渡航による決済ロック防止。"}, {"id": 20, "when": "出発直前", "task": "オフライン地図ダウンロード", "assignee": "全員", "category": "確認", "note": "高徳地図（Amap）または百度地図の北京エリア。"}, {"id": 21, "when": "出発直前", "task": "防寒着準備", "assignee": "全員", "category": "目安", "note": "10月下旬・長城山頂の冷え込みと強風を考慮。"}, {"id": 22, "when": "出発直前", "task": "モバイルバッテリー・電池規則確認", "assignee": "全員", "category": "確認", "note": "CA422/CA183の機内持込規則を確認。預け荷物には入れない。"}, {"id": 23, "when": "出発直前", "task": "電源・充電確認", "assignee": "全員", "category": "追加", "note": "中国220V。本体が100〜240V対応か確認。"}, {"id": 24, "when": "出発直前", "task": "人民元現金を少額用意", "assignee": "全員", "category": "追加", "note": "決済失敗時の予備。"}, {"id": 25, "when": "10/26帰国前", "task": "Visit Japan Web確認", "assignee": "全員", "category": "任意/要確認", "note": "日本入国時の税関申告の事前登録について資料記載。"}];
const KEY="beijing2026_check_v1";
let state=JSON.parse(localStorage.getItem(KEY)||"{}"), filter="all", hideDone=false;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function isDone(t){return !!state[t.id]}
function important(t){return /必須|優先度：高/.test(t.category)}
function save(){localStorage.setItem(KEY,JSON.stringify(state)); render()}
function render(){
 const person=document.getElementById("person").value;
 const visible=tasks.filter(t=>
   (person==="all" || t.assignee==="全員" || t.assignee.includes(person)) &&
   (filter==="all" || (filter==="open"&&!isDone(t)) || (filter==="done"&&isDone(t)) || (filter==="important"&&important(t))) &&
   (!hideDone || !isDone(t))
 );
 const total=tasks.length, done=tasks.filter(isDone).length, pct=total?Math.round(done/total*100):0;
 document.getElementById("count").textContent=`${done} / ${total}`;
 document.getElementById("pct").textContent=pct+"%";
 document.getElementById("bar").style.width=pct+"%";
 document.getElementById("shown").textContent=visible.length;
 document.getElementById("list").innerHTML=visible.length?visible.map(t=>`
 <article class="card ${isDone(t)?"done":""}">
 <input class="check" type="checkbox" ${isDone(t)?"checked":""} data-id="${t.id}">
 <div><div class="task">${esc(t.task)}</div><div class="meta"><span class="tag">${esc(t.assignee)}</span><span class="tag ${important(t)?"important":""}">${esc(t.category)}</span></div><div class="note">${esc(t.note)}</div></div>
 <div class="when">${esc(t.when)}</div></article>`).join(""):'<div class="empty">該当するタスクはありません。</div>';
 document.querySelectorAll(".check").forEach(x=>x.onchange=()=>{state[x.dataset.id]=x.checked;save()});
}
document.getElementById("person").onchange=render;
document.getElementById("clearDone").onclick=()=>{hideDone=!hideDone;document.getElementById("clearDone").textContent=hideDone?"完了を表示":"完了を非表示";render()};
document.getElementById("reset").onclick=()=>{if(confirm("この端末に保存したチェックをすべて消しますか？")){state={};save()}};
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));c.classList.add("active");filter=c.dataset.filter;render()});
render();
</script></body></html>
